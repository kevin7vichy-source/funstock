<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>產品中心 - 趣倉有限公司</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<script>tailwind.config={theme:{extend:{colors:{navy:'#0B2545',navy2:'#13315C',teal:'#0E9F96',amber:'#F5A524',ink:'#1E293B',muted:'#64748B',bg:'#F6F8FB'},fontFamily:{sans:['Inter','Noto Sans SC','sans-serif']}}}}</script>
<style>
  body{font-family:'Inter','Noto Sans SC',sans-serif;color:#1E293B;background:#fff;overflow-x:hidden}
  .img-hover-zoom img{transition:transform 0.6s ease}.img-hover-zoom:hover img{transform:scale(1.08)}
  .custom-nav{position:sticky;top:0;z-index:50;background:rgba(255,255,255,0.95);backdrop-filter:blur(10px);border-bottom:1px solid #E2E8F0}
  .nav-container{max-width:1280px;margin:0 auto;padding:15px 24px;display:flex;justify-content:space-between;align-items:center}
  .nav-links{display:flex;align-items:center;gap:24px;font-size:14px;font-weight:700}
  .nav-links a{color:#1E293B;text-decoration:none;transition:all 0.3s}.nav-links a:hover{color:#0E9F96}
  .nav-links a.active{color:#0E9F96;border-bottom:2px solid #0E9F96;padding-bottom:4px}
  .lang-switch{display:flex;align-items:center;gap:8px;border-left:1px solid #ccc;padding-left:16px;margin-left:8px;font-size:12px}
  .lang-switch a{color:#64748B}.lang-switch a.active{color:#0E9F96;font-weight:bold}
  .menu-toggle{display:none;cursor:pointer;font-size:28px;color:#0B2545;background:none;border:none}
  @media (max-width:900px){.menu-toggle{display:block}.nav-links{display:none;position:absolute;top:70px;left:0;right:0;background:rgba(255,255,255,0.98);flex-direction:column;padding:20px;gap:16px;box-shadow:0 10px 15px rgba(0,0,0,0.1);border-bottom:1px solid #ddd}.nav-links.show{display:flex}.lang-switch{border-left:none;padding-left:0;margin-left:0;border-top:1px solid #eee;padding-top:16px;justify-content:flex-start}}
</style>
</head>
<body class="antialiased">
<header class="custom-nav">
  <div class="nav-container">
    <a href="index.html"><img src="assets/logo-horizontal.svg" alt="趣倉 FUNSTOCK" style="height:40px"></a>
    <button class="menu-toggle" onclick="document.querySelector('.nav-links').classList.toggle('show')">☰</button>
    <div class="nav-links">
      <a href="index.html">首頁</a><a href="services.html">核心服務</a><a href="products.html" class="active">產品中心</a><a href="ecommerce.html">跨境電商</a><a href="process.html">服務流程</a><a href="about.html">關於趣倉</a><a href="contact.html">聯絡我們</a>
      <div class="lang-switch"><a href="products.html" class="active">繁</a><a href="zh-hans/products.html">简</a><a href="en/products.html">EN</a></div>
    </div>
  </div>
</header>
<main class="py-24 max-w-7xl mx-auto px-6">
  <div class="text-center mb-16"><h1 class="text-4xl font-extrabold text-navy mb-4">主營產品</h1><p class="text-muted">精選優質中國智造，滿足全球市場需求。</p></div>
  <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
    <div class="bg-white rounded-2xl overflow-hidden shadow-sm border border-gray-100 group">
      <div class="h-56 overflow-hidden img-hover-zoom"><img src="assets/img/electronics.webp" class="w-full h-full object-cover"></div>
      <div class="p-6"><h3 class="text-lg font-bold text-navy mb-2">消費電子產品</h3><p class="text-xs text-muted">智能穿戴、數碼配件、創新音頻等。</p></div>
    </div>
    <div class="bg-white rounded-2xl overflow-hidden shadow-sm border border-gray-100 group">
      <div class="h-56 overflow-hidden img-hover-zoom"><img src="assets/img/fpc.webp" class="w-full h-full object-cover"></div>
      <div class="p-6"><h3 class="text-lg font-bold text-navy mb-2">柔性線路板 FPC</h3><p class="text-xs text-muted">高密度單雙面及多層柔性電路板。</p></div>
    </div>
    <div class="bg-white rounded-2xl overflow-hidden shadow-sm border border-gray-100 group">
      <div class="h-56 overflow-hidden img-hover-zoom"><img src="assets/img/hardware.webp" class="w-full h-full object-cover"></div>
      <div class="p-6"><h3 class="text-lg font-bold text-navy mb-2">五金門鎖及建材</h3><p class="text-xs text-muted">高端合金構件、精密五金配件與智能門鎖。</p></div>
    </div>
  </div>
</main>
<footer class="bg-navy text-slate-400 py-12 border-t border-white/10 mt-12">
  <div class="max-w-7xl mx-auto px-6 flex flex-col md:flex-row justify-between items-center gap-6 text-sm">
    <img src="assets/logo-horizontal-white.svg" alt="趣倉 FUNSTOCK" class="h-10">
    <div class="text-center md:text-right text-xs"><p>© 2026 趣倉有限公司 FUNSTOCK LIMITED. All rights reserved.</p></div>
  </div>
</footer>
</body>
</html>
