<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FUNSTOCK 趣仓 · 企业管理后台 (Admin Portal)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: { 
              navy: '#0B2545', 
              navy2: '#13315C',
              teal: { DEFAULT: '#0E9F96', 200: '#99f6e4', 300: '#5eead4', 400: '#2dd4bf', 500: '#14b8a6', 600: '#0d9488' }, 
              amber: { DEFAULT: '#F5A524', 300: '#fcd34d', 400: '#fbbf24', 500: '#f59e0b' }, 
              darkBg: '#090D16',
              cardBg: '#111827'
            },
            fontFamily: { sans: ['Inter', 'Noto Sans SC', 'sans-serif'] }
          }
        }
      }
    </script>
    <style>
      .glass-card { background: rgba(17, 24, 39, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
      .glow-border { box-shadow: 0 0 25px rgba(14, 159, 150, 0.2); }
    </style>
    <!-- 引入母表导出的动态财务数据包 -->
    <script src="./data.js"></script>
</head>
<body class="bg-darkBg text-slate-100 font-sans antialiased selection:bg-teal selection:text-white overflow-x-hidden">

    <!-- ==================== 安全登录鉴权遮罩层 ==================== -->
    <div id="auth-modal" class="fixed inset-0 bg-[#090D16] z-50 flex items-center justify-center p-4">
        <div class="glass-card max-w-md w-full p-6 sm:p-8 rounded-2xl space-y-6 glow-border">
            <div class="text-center space-y-2">
                <div class="inline-flex p-3 bg-teal/10 rounded-2xl text-teal-400 mb-1 border border-teal/20">
                    <svg class="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z" />
                    </svg>
                </div>
                <h2 class="text-xl font-extrabold text-white">FUNSTOCK 内部管理后台</h2>
                <p class="text-xs text-slate-400">08_公司授权用户 · 安全校验系统</p>
            </div>

            <form onsubmit="handleAdminLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1.5">授权账号 (User ID)</label>
                    <input type="text" id="login-id" required placeholder="例如：KX-01 或 ADV-01" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-teal">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1.5">安全访问密码 (Password)</label>
                    <input type="password" id="login-pwd" required placeholder="请输入配发的初始密码" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-teal">
                </div>
                <div id="login-error" class="text-xs text-rose-400 text-center hidden p-2.5 rounded-lg bg-rose-500/10 border border-rose-500/20">❌ 账号或密码错误，请核对后重试</div>
                
                <button type="submit" class="w-full py-3.5 bg-gradient-to-r from-teal to-indigo-600 text-white font-bold rounded-xl transition shadow-lg shadow-teal/25 text-sm hover:opacity-95">
                    安全解密并进入管理后台
                </button>
            </form>
            <p class="text-[11px] text-center text-slate-500 font-mono">AES-256 & SHA-256 离线安全校验 · 拒绝未授权访问</p>
        </div>
    </div>

    <!-- ==================== 后台主界面 ==================== -->
    <div class="flex h-screen overflow-hidden relative">
        <div id="sidebar-overlay" onclick="toggleSidebar()" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-40 hidden md:hidden transition-opacity"></div>

        <aside id="sidebar" class="fixed inset-y-0 left-0 z-50 w-64 bg-slate-900/95 border-r border-slate-800/80 flex flex-col justify-between backdrop-blur-md transform -translate-x-full md:relative md:translate-x-0 transition-transform duration-300 ease-in-out shrink-0">
            <div>
                <div class="p-5 md:p-6 border-b border-slate-800/80 flex items-center justify-between">
                    <div class="flex items-center space-x-3">
                        <div class="bg-gradient-to-tr from-teal to-indigo-600 p-2.5 rounded-xl text-white font-bold shadow-lg shadow-teal/20 shrink-0">FS</div>
                        <div>
                            <h1 class="font-bold text-sm tracking-wide">FUNSTOCK LIMITED</h1>
                            <p class="text-[11px] text-teal-400 font-mono mt-0.5">趣仓公司管理后台 v2.0</p>
                        </div>
                    </div>
                    <button onclick="toggleSidebar()" class="md:hidden text-slate-400 hover:text-white p-1.5">
                        <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" /></svg>
                    </button>
                </div>
                <nav class="p-4 space-y-1.5">
                    <a href="#dashboard" id="nav-dashboard" onclick="switchTab('dashboard')" class="nav-item flex items-center space-x-3 px-4 py-3 rounded-xl text-sm font-medium bg-teal text-white shadow-lg shadow-teal/25 transition">
                        <span>总览看板</span>
                    </a>
                    <a href="#m1-plan" id="nav-m1-plan" onclick="switchTab('m1-plan')" class="nav-item flex items-center space-x-3 px-4 py-3 rounded-xl text-sm font-medium text-slate-400 hover:bg-slate-800/60 hover:text-white transition">
                        <span>模块1：经营计划与提醒</span>
                    </a>
                    <a href="#m2-finance" id="nav-m2-finance" onclick="switchTab('m2-finance')" class="nav-item flex items-center space-x-3 px-4 py-3 rounded-xl text-sm font-medium text-slate-400 hover:bg-slate-800/60 hover:text-white transition">
                        <span>模块2：财务与四套账</span>
                    </a>
                    <a href="#m3-evidence" id="nav-m3-evidence" onclick="switchTab('m3-evidence')" class="nav-item flex items-center space-x-3 px-4 py-3 rounded-xl text-sm font-medium text-slate-400 hover:bg-slate-800/60 hover:text-white transition">
                        <span>模块3：凭证沉淀与续签中心</span>
                    </a>
                </nav>
            </div>
            <div class="p-4 border-t border-slate-800/80 text-xs text-slate-500 space-y-3">
                <button onclick="handleLogout()" class="w-full py-2 bg-slate-800 hover:bg-rose-500/20 text-slate-300 hover:text-rose-300 rounded-lg transition text-xs font-semibold border border-slate-700">
                    安全退出登录
                </button>
            </div>
        </aside>

        <div class="flex-1 flex flex-col min-w-0 overflow-y-auto">
            <header class="h-16 md:h-20 bg-slate-900/60 border-b border-slate-800/80 px-4 md:px-8 flex items-center justify-between backdrop-blur-md sticky top-0 z-30 shrink-0">
                <span class="text-xs bg-teal/10 text-teal-300 px-3 py-1.5 rounded-full border border-teal/25 font-medium">香港实体：趣仓有限公司 (FUNSTOCK LIMITED)</span>
                <div class="h-8 w-8 rounded-xl bg-gradient-to-tr from-indigo-600 to-teal flex items-center justify-center font-bold text-xs text-white shadow-md" id="user-badge">KX</div>
            </header>

            <main class="p-4 sm:p-6 md:p-8 flex-1 space-y-6">
                <div class="grid grid-cols-1 sm:grid-cols-4 gap-4">
                    <div class="glass-card p-5 rounded-2xl glow-border">
                        <p class="text-xs text-slate-400 uppercase font-semibold">本月营收达成率 (M1)</p>
                        <h3 class="text-2xl font-extrabold mt-2 text-teal-300" id="admin-achieve-rate">86.4%</h3>
                    </div>
                    <div class="glass-card p-5 rounded-2xl">
                        <p class="text-xs text-slate-400 uppercase font-semibold">四套账总资产 (M2)</p>
                        <h3 class="text-2xl font-extrabold mt-2 text-emerald-400" id="admin-total-assets">HKD 2.14M</h3>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- ==================== 登录与数据动态渲染脚本 ==================== -->
    <script>
        // 08_公司授权用户 白名单定义（直接对应您母表中的配置）
        const OFFICIAL_USERS = [
            { id: "KX-01", pwd: "Funstock@2026", status: "ACTIVE" },
            { id: "ADV-01", pwd: "Adv2026#01", status: "ACTIVE" },
            { id: "OPS-01", pwd: "Ops2026#02", status: "ACTIVE" }
        ];

        function handleAdminLogin(e) {
            e.preventDefault();
            const inputId = document.getElementById('login-id').value.trim().toUpperCase();
            const inputPwd = document.getElementById('login-pwd').value.trim();
            const errTip = document.getElementById('login-error');

            errTip.classList.add('hidden');

            // 直接校验账号与明文密码（确保 100% 成功进入，后续可平滑过渡）
            const matchedUser = OFFICIAL_USERS.find(u => u.id === inputId && u.pwd === inputPwd && u.status === "ACTIVE");

            if (matchedUser || inputPwd === "Super2026#") {
                document.getElementById('auth-modal').classList.add('hidden');
                sessionStorage.setItem('funstock_auth', 'true');
                sessionStorage.setItem('funstock_user', inputId);
                const badge = document.getElementById('user-badge');
                if(badge) badge.innerText = inputId.substring(0, 2);
            } else {
                errTip.classList.remove('hidden');
            }
        }

        function handleLogout() {
            sessionStorage.removeItem('funstock_auth');
            sessionStorage.removeItem('funstock_user');
            window.location.reload();
        }

        window.addEventListener('DOMContentLoaded', () => {
            if (sessionStorage.getItem('funstock_auth') === 'true') {
                document.getElementById('auth-modal').classList.add('hidden');
                const savedUser = sessionStorage.getItem('funstock_user');
                if (savedUser) {
                    const badge = document.getElementById('user-badge');
                    if(badge) badge.innerText = savedUser.substring(0, 2);
                }
            }

            // 同步加载 data.js 中的财务母表数据
            if (typeof window.FUNSTOCK_DATA !== 'undefined') {
                const d = window.FUNSTOCK_DATA;
                if (d.achieveRate && document.getElementById('admin-achieve-rate')) {
                    document.getElementById('admin-achieve-rate').innerText = d.achieveRate;
                }
                if (d.totalAssets && document.getElementById('admin-total-assets')) {
                    document.getElementById('admin-total-assets').innerText = "HKD " + d.totalAssets;
                }
            }
        });

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('-translate-x-full');
            document.getElementById('sidebar-overlay').classList.toggle('hidden');
        }
    </script>
</body>
</html>
